{% set version = "2.2.1" %}
{% set python_min = "3.10" %}

package:
  name: transitionlistener
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/T/TransitionListener/transitionlistener-{{ version }}.tar.gz
  # Checksum of the published source archive. It can only be taken once the version
  # above is on PyPI, so a version bump leaves it stale until it is recorded.
  sha256: cb397968fde6aae14c7e1e9997f9aaac1b12107571ff60b8b1d0dc4bf55930d9

build:
  entry_points:
    - tl = transitionlistener.interface:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - pillow
    - pyyaml
    - corner
    - cycler
    - getdist
    - h5py
    - matplotlib-base
    - mpi4py
    - numpy >=1.21
    - pandas
    - rich
    - scipy
    - tqdm
    - ultranest

test:
  imports:
    - transitionlistener
  commands:
    - pip check
    - tl --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://tasillo.de/TransitionListener/
  summary: Framework for analyzing cosmological first-order phase transitions and their gravitational wave signatures.
  doc_url: https://tasillo.de/TransitionListener/
  license: GPL-3.0-only
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tasicarl
