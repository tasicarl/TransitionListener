# Reference copy of the conda-forge recipe, kept in step with the declared version.
# The recipe that is actually built is the one in the conda-forge/transitionlistener-feedstock
# repository: after each PyPI release its bot opens a pull request there that bumps the version
# and records the checksum of the published archive, so no checksum is carried here.
{% set version = "2.2.1" %}
{% set python_min = "3.11" %}

package:
  name: transitionlistener
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/T/TransitionListener/transitionlistener-{{ version }}.tar.gz

build:
  entry_points:
    - tl = transitionlistener.interface:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - pillow
    - pyyaml
    - corner
    - cycler
    - getdist
    - h5py
    - matplotlib-base
    - mpi4py
    - numpy >=1.21
    - pandas
    - rich
    - scipy
    - tqdm
    - ultranest

test:
  imports:
    - transitionlistener
  commands:
    - pip check
    - tl --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://tasillo.de/TransitionListener/
  summary: Framework for analyzing cosmological first-order phase transitions and their gravitational wave signatures.
  doc_url: https://tasillo.de/TransitionListener/
  license: GPL-3.0-only
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tasicarl
