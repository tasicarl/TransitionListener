# Single-point scan for the conformal U(1) model
# Run with: tl -c examples/example_point.yaml -v

# ==================================================
# Scan settings
# ================================================== 
Modelfile:
  models/TL_conformal_dark_u1.py

Potential:
  specific_potential

Scan:
  SinglePoint

Parameters:
  g: 0.7
  v_GeV: 0.1
  y: 0.01

# ==================================================
# output stuff
# ==================================================
timeout: -1  # Timeout in seconds for the individual TL run, -1 for no timeout
format: txt  # either "txt" or "hdf5"
output_path: scans/example_point
description: example point, conformal U(1) model
plot_description: Example point, conformal $U(1)$ model

additional_plots:
  action:
    plot?: False
    Tmin_GeV: 0
    Tmax_GeV: 0.05
    phase_indices: [0, 1]
    n: 100

  potential:
    plot?: False
    T_GeV: 0.02
    phi_ranges_GeV: [0, 1]
    n: 100

  phases:
    plot?: True
    include_transitions?: False

  profileV:
    plot?: False
    field_index_1: 0
    field_index_2: 1

  energy_density:
    plot?: False
    Tmin_GeV: 0.01
    Tmax_GeV: 0.05
  
  dofs:
    Tmin_GeV: 0.01
    Tmax_GeV: 0.05
    plot?: False

  sensitivities:
    plot?: False

  profile:
    plot?: False

  percolation:
    plot?: False

  gw_spectrum:
    plot?: True
