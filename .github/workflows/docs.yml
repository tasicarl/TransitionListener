name: Build and Deploy Sphinx to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up TL conda environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: TL
          init-shell: bash
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
          create-args: >
            python=3.10
            ptarcade
            ultranest
            tqdm
            corner
            getdist
            mpi4py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install documentation dependencies
        shell: bash -l {0}
        run: |
          python -m pip install -U pip
          pip install sphinx myst-parser sphinx-autodoc-typehints furo rich


      - name: Build HTML
        shell: bash -l {0}
        run: sphinx-build -b html docs/source docs/_build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
