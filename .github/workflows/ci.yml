name: CI

on:
  push:
    branches: [release, main]
  pull_request:
    branches: [release, main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System packages for mpi4py
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin

      - name: Install TransitionListener (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm `tl` is on PATH
        run: tl --help >/dev/null

      - name: Release smoke test
        run: pytest -v tests/test_release_smoke.py
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
