[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TransitionListener"
version = "2.1.0"
description = "Framework for analyzing cosmological first-order phase transitions and their gravitational wave signatures."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Carlo Tasillo", email = "carlo.tasillo@ific.uv.es" },
    { name = "Jonas Matuszak", email = "jonas.matuszak@kit.edu" },
]
keywords = [
    "cosmology", "gravitational waves", "phase transitions",
    "ptarcade", "pulsar timing", "particle physics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "Pillow",
    "PyYAML",
    "corner",
    "cycler",
    "getdist",
    "h5py",
    "matplotlib",
    "mpi4py",
    "numpy>=1.21",
    "pandas",
    "rich",
    "scipy",
    "tqdm",
    "ultranest",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://tasillo.de/TransitionListener/"
Documentation = "https://tasillo.de/TransitionListener/"
Repository = "https://github.com/tasicarl/TransitionListener"
Issues = "https://github.com/tasicarl/TransitionListener/issues"

[project.scripts]
tl = "transitionlistener.interface:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transitionlistener"]

# Include models/, examples/, and the installation check from outside src/.
# Files are remapped into the transitionlistener namespace so they are
# accessible via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"models"                      = "transitionlistener/models"
"examples"                    = "transitionlistener/examples"
"tests/check_installation.py" = "transitionlistener/check_installation.py"
